<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b38"/>
      <stop offset="1" stop-color="#171a23"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- pared empapelada -->
  <g>
    <rect x="0" y="0" width="320" height="140" fill="#8fb18c"/>
    <rect x="26" y="0" width="26" height="140" fill="#b6cdb4"/>
    <rect x="104" y="0" width="26" height="140" fill="#b6cdb4"/>
    <rect x="182" y="0" width="26" height="140" fill="#b6cdb4"/>
    <rect x="260" y="0" width="26" height="140" fill="#b6cdb4"/>
    <g fill="#e9e2c8">
      <circle cx="39" cy="28" r="5"/><circle cx="117" cy="28" r="5"/><circle cx="195" cy="28" r="5"/><circle cx="273" cy="28" r="5"/>
      <circle cx="39" cy="84" r="5"/><circle cx="117" cy="84" r="5"/><circle cx="195" cy="84" r="5"/><circle cx="273" cy="84" r="5"/>
    </g>
  </g>
  <!-- piso de madera -->
  <g>
    <rect x="0" y="140" width="320" height="60" fill="#b5824f"/>
    <rect x="0" y="152" width="320" height="2" fill="#7a5230" opacity=".5"/>
    <rect x="0" y="168" width="320" height="2" fill="#7a5230" opacity=".5"/>
    <rect x="0" y="184" width="320" height="2" fill="#7a5230" opacity=".5"/>
    <rect x="60" y="140" width="2" height="60" fill="#7a5230" opacity=".4"/>
    <rect x="150" y="140" width="2" height="60" fill="#7a5230" opacity=".4"/>
    <rect x="240" y="140" width="2" height="60" fill="#7a5230" opacity=".4"/>
  </g>
  <!-- maniquí camuflado contra la pared (pintado como el empapelado) -->
  <g>
    <circle cx="117" cy="52" r="16" fill="#b6cdb4"/>
    <circle cx="121" cy="45" r="4.5" fill="#e9e2c8"/>
    <rect x="103" y="66" width="28" height="44" rx="12" fill="#8fb18c"/>
    <rect x="104" y="66" width="12" height="44" rx="6" fill="#b6cdb4"/>
    <rect x="96" y="68" width="9" height="34" rx="4.5" fill="#8fb18c"/>
    <rect x="130" y="68" width="9" height="34" rx="4.5" fill="#b6cdb4"/>
    <rect x="104" y="108" width="11" height="34" rx="5" fill="#8fb18c"/>
    <rect x="120" y="108" width="11" height="34" rx="5" fill="#b6cdb4"/>
    <!-- ojos que lo delatan -->
    <circle cx="111" cy="50" r="4" fill="#fff"/>
    <circle cx="123" cy="50" r="4" fill="#fff"/>
    <circle cx="112" cy="51" r="1.8" fill="#222"/>
    <circle cx="124" cy="51" r="1.8" fill="#222"/>
  </g>
  <!-- maniquí blanco a medio pintar, con rodillo -->
  <g>
    <circle cx="225" cy="60" r="15" fill="#eeeef4"/>
    <circle cx="229" cy="53" r="4" fill="#d8d8e2"/>
    <rect x="212" y="73" width="26" height="40" rx="11" fill="#eeeef4"/>
    <path d="M212 93 h26 v9 a11 11 0 0 1 -11 11 h-4 a11 11 0 0 1 -11 -11 z" fill="#e85d4a"/>
    <rect x="205" y="75" width="8" height="31" rx="4" fill="#eeeef4"/>
    <rect x="237" y="75" width="8" height="31" rx="4" fill="#eeeef4" transform="rotate(-28 241 75)"/>
    <rect x="213" y="111" width="10" height="31" rx="5" fill="#e85d4a"/>
    <rect x="227" y="111" width="10" height="31" rx="5" fill="#eeeef4"/>
    <circle cx="220" cy="58" r="3.6" fill="#fff"/>
    <circle cx="231" cy="58" r="3.6" fill="#fff"/>
    <circle cx="221" cy="59" r="1.7" fill="#222"/>
    <circle cx="232" cy="59" r="1.7" fill="#222"/>
    <!-- rodillo con pintura -->
    <rect x="248" y="56" width="5" height="26" rx="2.5" fill="#8a8a96"/>
    <rect x="243" y="46" width="15" height="12" rx="5" fill="#e85d4a"/>
  </g>
  <!-- título -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800">
    <text x="18" y="178" font-size="30" fill="#ffffff" stroke="#14161d" stroke-width="5" paint-order="stroke">DISIMULÁ</text>
    <text x="20" y="194" font-size="11" fill="#ffd166" stroke="#14161d" stroke-width="3" paint-order="stroke">pintate · escondete · que no te vean</text>
  </g>
</svg>
