<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Prisma · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>

    <!-- durante el juego -->
    <div class="hud" id="hud" hidden>
      <div class="top" id="hud-top">
        <button class="round" id="b-pause" aria-label="pausa">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
        </button>
        <div class="title"><small id="h-chap"></small><b id="h-name"></b></div>
        <div class="moves">
          <b><span id="h-moves">0</span><em id="h-moves-l"></em></b>
          <small id="h-par"></small>
          <span class="meter" id="h-stars"><i>★</i><i>★</i><i>★</i></span>
        </div>
      </div>
      <div class="bar" id="hud-bar">
        <button class="act" id="b-undo">
          <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5" /><path d="M4.6 12H14a6 6 0 0 1 0 12h-2" transform="translate(0 -6)" /></svg>
          <span data-t="undo"></span><kbd>Z</kbd>
        </button>
        <button class="act" id="b-reset">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4.5h4.5" /></svg>
          <span data-t="reset"></span><kbd>R</kbd>
        </button>
        <button class="act gold" id="b-hint">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4" /><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3Z" /></svg>
          <span data-t="hint"></span><b class="badge" id="h-hints">3</b><kbd>H</kbd>
        </button>
      </div>
      <div class="bubble" id="bubble"></div>
    </div>

    <!-- inicio -->
    <section class="screen on" id="s-home">
      <div class="card home">
        <p class="kicker" data-t="museum"></p>
        <h1 class="logo">Prisma</h1>
        <p class="sub" data-t="tagline"></p>
        <button class="btn primary" id="b-play"><span data-t="play"></span><small id="b-play-sub"></small></button>
        <div class="row2">
          <button class="btn" id="b-levels"><span data-t="levels"></span><small id="b-levels-sub"></small></button>
          <button class="btn dawn" id="b-daily"><span data-t="daily"></span><small id="b-daily-sub"></small></button>
        </div>
        <p class="keys" id="home-keys"></p>
      </div>
    </section>

    <!-- capítulos y niveles -->
    <section class="screen" id="s-levels">
      <div class="card wide">
        <h2 data-t="levels"></h2>
        <p class="sub small" id="lv-total"></p>
        <div class="chapters" id="chapters"></div>
        <button class="link" id="b-levels-back" data-t="back"></button>
      </div>
    </section>

    <!-- pieza nueva -->
    <section class="screen dim" id="s-tip">
      <div class="card">
        <p class="kicker" data-t="newIdea"></p>
        <h2 id="tip-title"></h2>
        <canvas class="demo" id="tip-c" width="300" height="300"></canvas>
        <p class="sub" id="tip-text"></p>
        <button class="btn primary" id="b-tip-go"><span data-t="gotIt"></span></button>
      </div>
    </section>

    <!-- pausa -->
    <section class="screen dim" id="s-pause">
      <div class="card">
        <p class="kicker" id="p-kicker"></p>
        <h2 data-t="paused"></h2>
        <button class="btn primary" id="b-resume"><span data-t="resume"></span></button>
        <div class="row2">
          <button class="btn" id="b-p-reset"><span data-t="reset"></span></button>
          <button class="btn" id="b-p-levels"><span data-t="toLevels"></span></button>
        </div>
        <button class="link" id="b-p-home" data-t="toHome"></button>
      </div>
    </section>

    <!-- nivel resuelto -->
    <section class="screen dim" id="s-win">
      <div class="card win">
        <p class="kicker" id="w-kicker"></p>
        <h2 id="w-title"></h2>
        <div class="stars" id="w-stars"></div>
        <p class="sub" id="w-text"></p>
        <p class="gift" id="w-gift" hidden></p>
        <button class="btn primary" id="b-next"><span data-t="next"></span><small id="b-next-sub"></small></button>
        <p class="sub" id="w-all" hidden></p>
        <div class="row2">
          <button class="btn" id="b-again"><span data-t="again"></span></button>
          <button class="btn" id="b-w-levels"><span data-t="toLevels"></span></button>
        </div>
      </div>
    </section>

    <!-- luz del día resuelta -->
    <section class="screen dim" id="s-daily">
      <div class="card win">
        <p class="kicker" id="d-kicker"></p>
        <h2 id="d-title"></h2>
        <div class="stars" id="d-stars"></div>
        <p class="sub" id="d-text"></p>
        <div class="stats" id="d-stats"></div>
        <p class="next-day"><span data-t="nextDaily"></span> <b id="d-clock">00:00:00</b></p>
        <button class="btn dawn" id="b-share"><span data-t="share"></span></button>
        <p class="status" id="d-status"></p>
        <div class="row2">
          <button class="btn" id="b-d-again"><span data-t="again"></span></button>
          <button class="btn" id="b-d-home"><span data-t="toHome"></span></button>
        </div>
      </div>
    </section>

    <!-- sin pistas: ver un anuncio -->
    <section class="screen dim" id="s-nohint">
      <div class="card">
        <h2 data-t="noHints"></h2>
        <p class="sub" id="nh-text"></p>
        <button class="btn gold" id="b-reward" hidden><span data-t="watchAd"></span></button>
        <button class="link" id="b-nh-back" data-t="back"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
