<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Sudoku · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game" id="game">
      <header class="top" id="top">
        <div class="lv"><b id="lv-t"></b><small id="lv-s"></small></div>
        <div class="time" id="time">00:00</div>
        <div class="miss" id="miss" title=""></div>
        <button class="pause" id="b-pause" aria-label="pausa"><i></i><i></i></button>
      </header>
      <div class="race" id="race" hidden></div>
      <section class="stage" id="stage">
        <div class="board" id="board" role="grid" aria-label="Sudoku"></div>
        <div class="cover" id="cover" hidden><b id="cover-t"></b><small id="cover-s"></small></div>
      </section>
      <aside class="side" id="side">
        <div class="hintbar" id="hintbar" hidden>
          <p id="hint-t"></p>
          <div class="hb"><button class="act apply" id="hint-apply"></button><button class="act x" id="hint-close" aria-label="cerrar">✕</button></div>
        </div>
        <div class="tools" id="tools">
          <button class="tool" id="t-undo" data-t-title="undo" aria-label="deshacer"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12h-3" transform="translate(0 -3)" /></svg><span data-t="undo"></span></button>
          <button class="tool" id="t-redo" aria-label="rehacer"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M20 12H10a6 6 0 0 0 0 12h3" transform="translate(0 -3)" /></svg><span data-t="redo"></span></button>
          <button class="tool" id="t-erase" aria-label="borrar"><svg viewBox="0 0 24 24"><path d="M4 16 14 5l6 6-8 8H7zM9 20h11M8.5 10.5l6 6" /></svg><span data-t="erase"></span></button>
          <button class="tool" id="t-notes" aria-label="notas" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3" /></svg><span data-t="notes"></span><em id="notes-state"></em></button>
          <button class="tool" id="t-auto" aria-label="notas automáticas"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4zM18 15l.9 2.1 2.1.9-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z" /></svg><span data-t="auto"></span></button>
          <button class="tool" id="t-hint" aria-label="pista"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" /></svg><span data-t="hint"></span><em id="hint-n"></em></button>
        </div>
        <div class="pad" id="pad"></div>
      </aside>
    </main>

    <!-- inicio -->
    <section class="screen on" id="s-home">
      <div class="panel home">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <h1 data-t="title"></h1>
        <p class="sub" data-t="tagline"></p>
        <button class="btn cont" id="b-continue" hidden><span id="cont-t"></span><small id="cont-s"></small></button>
        <p class="lbl2" data-t="newGame"></p>
        <div class="levels" id="levels">
          <button class="btn lvl l1" data-level="1"><span data-t="lv1"></span><small data-t="lv1s"></small></button>
          <button class="btn lvl l2" data-level="2"><span data-t="lv2"></span><small data-t="lv2s"></small></button>
          <button class="btn lvl l3" data-level="3"><span data-t="lv3"></span><small data-t="lv3s"></small></button>
          <button class="btn lvl l4" data-level="4"><span data-t="lv4"></span><small data-t="lv4s"></small></button>
        </div>
        <button class="btn mint" id="b-daily"><span data-t="daily"></span><small id="b-daily-sub"></small></button>
        <button class="btn coral" id="b-online"><span data-t="online"></span><small data-t="onlineSub"></small></button>
        <button class="link" id="b-rules" data-t="rulesTitle"></button>
      </div>
    </section>

    <!-- online -->
    <section class="screen" id="s-online">
      <div class="panel">
        <h2 data-t="online"></h2>
        <p class="sub small" data-t="onlineLong"></p>
        <input class="field" id="on-name" maxlength="16" autocomplete="off" spellcheck="false" />
        <button class="btn sun" id="on-quick"><span data-t="quick"></span><small data-t="quickSub"></small></button>
        <button class="btn blue" id="on-create"><span data-t="create"></span><small data-t="createSub"></small></button>
        <div class="join">
          <input class="field code" id="on-code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABCDE" aria-label="código" />
          <button class="btn mint" id="on-join"><span data-t="join"></span></button>
        </div>
        <p class="status" id="on-status"></p>
        <button class="link" id="on-back" data-t="back"></button>
      </div>
    </section>

    <!-- sala -->
    <section class="screen" id="s-lobby">
      <div class="panel">
        <p class="kicker" data-t="room"></p>
        <button class="code-big" id="lobby-code">-----</button>
        <p class="hint2" data-t="tapToCopy"></p>
        <ul class="plist" id="lobby-players"></ul>
        <div class="opt"><span class="lbl" data-t="level"></span><div class="seg" id="seg-level"><button data-v="easy" data-t="lv1"></button><button data-v="medium" data-t="lv2"></button><button data-v="hard" data-t="lv3"></button><button data-v="expert" data-t="lv4"></button></div></div>
        <button class="btn sun" id="lobby-start"><span data-t="startRace"></span></button>
        <p class="status" id="lobby-status"></p>
        <button class="link" id="lobby-leave" data-t="leave"></button>
      </div>
    </section>

    <!-- resultados de la carrera -->
    <section class="screen dim" id="s-results">
      <div class="panel">
        <h2 id="res-title"></h2>
        <ol class="rank" id="res-rank"></ol>
        <button class="btn sun" id="res-again"><span></span></button>
        <button class="link" id="res-leave" data-t="leave"></button>
      </div>
    </section>

    <!-- cómo se juega -->
    <section class="screen" id="s-rules">
      <div class="panel wide">
        <h2 data-t="rulesTitle"></h2>
        <div class="rules" id="rules-body"></div>
        <button class="btn sun" id="b-rules-ok"><span data-t="gotIt"></span></button>
      </div>
    </section>

    <!-- pausa y ajustes -->
    <section class="screen dim" id="s-pause">
      <div class="panel">
        <h2 data-t="paused"></h2>
        <div class="opt"><span class="lbl" data-t="errors"></span><div class="seg" id="o-errors"><button data-v="2" data-t="errCount"></button><button data-v="1" data-t="errShow"></button><button data-v="0" data-t="errOff"></button></div></div>
        <div class="opt"><span class="lbl" data-t="autoClean"></span><div class="seg" id="o-clean"><button data-v="1" data-t="yes"></button><button data-v="0" data-t="no"></button></div></div>
        <div class="opt"><span class="lbl" data-t="sameDigit"></span><div class="seg" id="o-same"><button data-v="1" data-t="yes"></button><button data-v="0" data-t="no"></button></div></div>
        <button class="btn sun" id="b-resume"><span data-t="resume"></span></button>
        <button class="btn ghost" id="b-p-rules"><span data-t="rulesTitle"></span></button>
        <button class="link" id="b-quit" data-t="quit"></button>
      </div>
    </section>

    <!-- terminó -->
    <section class="screen dim" id="s-over">
      <div class="panel">
        <p class="kicker" id="over-kicker"></p>
        <h2 id="over-title"></h2>
        <div class="final" id="over-final"></div>
        <div class="stats" id="over-stats" hidden></div>
        <p class="next-day" id="over-next" hidden><span data-t="nextDaily"></span> <b id="over-clock">00:00:00</b></p>
        <button class="btn mint" id="b-share" hidden><span data-t="share"></span></button>
        <p class="status" id="over-status"></p>
        <button class="btn sun" id="b-again"><span id="b-again-t"></span></button>
        <button class="link" id="b-over-menu" data-t="menu"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
