<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Truco · game.it</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
    <script src="/sdk/gameit.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game" id="game">
      <div class="table" id="table">
        <div class="seats" id="seats"></div>
        <div class="pile" id="pile"></div>
        <div class="deck" id="deck" aria-hidden="true"></div>
        <div class="hud">
          <button class="score" id="score" aria-label="tanteador"></button>
        </div>
        <span class="worth" id="worth" hidden></span>
        <div class="toast" id="toast" hidden></div>
        <div class="callout" id="callout"><b id="callout-t"></b><small id="callout-s"></small></div>
        <button class="pause" id="b-pause" aria-label="pausa"><i></i><i></i></button>
        <div class="clock" id="clock" hidden><b id="clock-t"></b></div>
      </div>
      <div class="me" id="me">
        <div class="bubble mine" id="me-bubble"></div>
        <div class="info"><span class="tag" id="env-hint" hidden></span><span class="tag mano" id="me-mano" hidden></span><p class="status" id="status"></p></div>
        <div class="bar" id="bar"></div>
        <div class="hand" id="hand"></div>
      </div>
    </main>

    <!-- inicio -->
    <section class="screen on" id="s-home">
      <div class="panel home">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <h1 data-t="title"></h1>
        <p class="sub" data-t="tagline"></p>
        <button class="btn sun" id="b-cpu"><span data-t="vsCpu"></span><small data-t="vsCpuSub"></small></button>
        <button class="btn coral" id="b-online"><span data-t="online"></span><small data-t="onlineSub"></small></button>
        <button class="btn mint" id="b-daily"><span data-t="daily"></span><small id="b-daily-sub"></small></button>
        <button class="link" id="b-rules" data-t="rulesTitle"></button>
      </div>
    </section>

    <!-- contra la compu -->
    <section class="screen" id="s-cpu">
      <div class="panel">
        <h2 data-t="vsCpu"></h2>
        <div class="opt"><span class="lbl" data-t="format"></span><div class="seg" id="o-n"><button data-v="2" data-t="f2"></button><button data-v="4" data-t="f4"></button></div></div>
        <p class="sub small" id="o-n-help"></p>
        <div class="opt"><span class="lbl" data-t="level"></span><div class="seg" id="o-level"><button data-v="1" data-t="lv1"></button><button data-v="2" data-t="lv2"></button><button data-v="3" data-t="lv3"></button></div></div>
        <div class="opt"><span class="lbl" data-t="target"></span><div class="seg" id="o-target"><button data-v="15">15</button><button data-v="30">30</button></div></div>
        <div class="opt"><span class="lbl" data-t="florOpt"></span><div class="seg" id="o-flor"><button data-v="0" data-t="sinFlor"></button><button data-v="1" data-t="conFlor"></button></div></div>
        <button class="btn sun" id="b-cpu-go"><span data-t="go"></span></button>
        <button class="link" id="b-cpu-back" data-t="back"></button>
      </div>
    </section>

    <!-- online -->
    <section class="screen" id="s-online">
      <div class="panel">
        <h2 data-t="online"></h2>
        <p class="sub small" data-t="onlineLong"></p>
        <input class="field" id="on-name" maxlength="16" autocomplete="off" spellcheck="false" />
        <button class="btn sun" id="on-create"><span data-t="create"></span><small data-t="createSub"></small></button>
        <div class="join">
          <input class="field code" id="on-code" maxlength="5" autocomplete="off" spellcheck="false" placeholder="ABCDE" aria-label="código" />
          <button class="btn mint" id="on-join"><span data-t="join"></span></button>
        </div>
        <p class="status" id="on-status"></p>
        <button class="link" id="on-back" data-t="back"></button>
      </div>
    </section>

    <!-- sala -->
    <section class="screen" id="s-lobby">
      <div class="panel">
        <p class="kicker" data-t="room"></p>
        <button class="code-big" id="lobby-code">-----</button>
        <p class="hint2" data-t="tapToCopy"></p>
        <ul class="plist" id="lobby-players"></ul>
        <div id="lobby-host">
          <div class="opt"><span class="lbl" data-t="format"></span><div class="seg" data-k="n"><button data-v="2" data-t="f2"></button><button data-v="4" data-t="f4"></button></div></div>
          <div class="opt" id="lobby-pair"><span class="lbl" data-t="pairs"></span><div class="seg" data-k="pair"><button data-v="0" data-t="pairMix"></button><button data-v="1" data-t="pairTogether"></button></div></div>
          <div class="opt"><span class="lbl" data-t="target"></span><div class="seg" data-k="target"><button data-v="15">15</button><button data-v="30">30</button></div></div>
          <div class="opt"><span class="lbl" data-t="florOpt"></span><div class="seg" data-k="flor"><button data-v="0" data-t="sinFlor"></button><button data-v="1" data-t="conFlor"></button></div></div>
          <div class="opt"><span class="lbl" data-t="cpuLevel"></span><div class="seg" data-k="level"><button data-v="1" data-t="lv1"></button><button data-v="2" data-t="lv2"></button><button data-v="3" data-t="lv3"></button></div></div>
        </div>
        <button class="btn sun" id="lobby-start"><span data-t="start"></span></button>
        <p class="status" id="lobby-status"></p>
        <button class="link" id="lobby-leave" data-t="leave"></button>
      </div>
    </section>

    <!-- cómo se juega -->
    <section class="screen" id="s-rules">
      <div class="panel wide">
        <h2 data-t="rulesTitle"></h2>
        <div class="rules" id="rules-body"></div>
        <button class="btn sun" id="b-rules-ok"><span data-t="gotIt"></span></button>
      </div>
    </section>

    <!-- pausa -->
    <section class="screen dim" id="s-pause">
      <div class="panel">
        <h2 data-t="paused"></h2>
        <button class="btn sun" id="b-resume"><span data-t="resume"></span></button>
        <button class="btn ghost" id="b-p-rules"><span data-t="rulesTitle"></span></button>
        <button class="link" id="b-quit" data-t="quit"></button>
      </div>
    </section>

    <!-- fin -->
    <section class="screen dim" id="s-over">
      <div class="panel">
        <p class="kicker" id="over-kicker"></p>
        <h2 id="over-title"></h2>
        <div class="final" id="over-final"></div>
        <div class="stats" id="over-stats" hidden></div>
        <p class="next-day" id="over-next" hidden><span data-t="nextDaily"></span> <b id="over-clock">00:00:00</b></p>
        <button class="btn mint" id="b-share" hidden><span data-t="share"></span></button>
        <p class="status" id="over-status"></p>
        <button class="btn sun" id="b-again"><span id="b-again-t"></span></button>
        <button class="link" id="b-over-menu" data-t="menu"></button>
      </div>
    </section>

    <script type="module" src="./game.js"></script>
  </body>
</html>
