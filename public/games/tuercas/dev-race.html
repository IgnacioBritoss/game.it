<!doctype html>
<html><head><meta charset="utf-8"><title>dev race</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { Stage } from './scene.js';
import { createRace, stepRace } from './shared/race.js';
const q = new URLSearchParams(location.search);
const id = q.get('id') || 'pradera';
const canvas = document.getElementById('c');
const stage = new Stage(canvas, { quality: 1 });
stage.loadTrack(id);
const R = createRace({ track: id, cls: q.get('cls') || 'carrera', seed: +(q.get('seed') || 3), mode: q.get('mode') || 'attract', noCount: q.get('count') !== '1', entries: q.get('human') ? [{ cfg: { driver: 'lola', body: 'flecha', wheels: 'lisas', extra: 'aleron', paint: 1, tune: [0,0,0] }, human: 0, name: 'Vos' }] : [] });
stage.setRace(R);
const sim = +(q.get('sim') || 20);
const watch = [];
const camKart = () => R.karts[+(q.get('k') || 0)];
const t0 = performance.now();
const evs = [];
for (let i = 0; i < sim * 120; i++) {
  stepRace(R, []);
  for (const e of R.events) { stage.fx(e, [camKart()]); }
  R.events.length = 0;
}
const simMs = performance.now() - t0;
const rect = { x: 0, y: 0, w: innerWidth, h: innerHeight };
const frames = +(q.get('frames') || 10);
for (let f = 0; f < frames; f++) {
  stepRace(R, []); for (const e of R.events) stage.fx(e, [camKart()]); R.events.length = 0;
  stage.render(R, 1, 1 / 60, 5 + f / 60, [{ rect, kart: camKart() }]);
}
window.__info = { simMs: Math.round(simMs), calls: stage.r.info.render.calls, tris: stage.r.info.render.triangles, order: R.order.slice(0, 3).map((k) => k.name), t: +R.t.toFixed(1) };
document.title = 'ok';
</script></body></html>
