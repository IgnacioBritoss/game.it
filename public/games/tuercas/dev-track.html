<!doctype html>
<html><head><meta charset="utf-8"><title>dev track</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { THREE, paintMat } from './models.js';
import { World } from './world.js';
import { getTrack } from './shared/tracks.js';
import { pointAt } from './shared/track.js';
import { makeVehicle } from './vehicles.js';
const q = new URLSearchParams(location.search);
const T = getTrack(q.get('id') || 'pradera');
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const t0 = performance.now();
const W = new World(T, +(q.get('q') || 1));
const buildMs = performance.now() - t0;
const th = W.th;
scene.background = new THREE.Color(th.fog[0]);
scene.fog = new THREE.Fog(th.fog[0], th.fog[1], th.fog[2]);
scene.add(new THREE.HemisphereLight(th.hemi[0], th.hemi[1], th.hemi[2]));
const sun = new THREE.DirectionalLight(th.sun.color, th.sun.i); sun.position.set(...th.sun.dir); scene.add(sun);
scene.add(W.group);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 62), innerWidth / innerHeight, 0.3, 1600);
const mode = q.get('m') || 'chase';
let vehicles = [];
if (q.get('cars') !== '0') {
  for (let k = 0; k < 4; k++) {
    const P = pointAt(T, 6 + k * 6, (k % 2 ? -1 : 1) * 3, true);
    const v = makeVehicle({ driver: ['capi', 'lola', 'tuco', 'rulo'][k], body: ['clasico', 'flecha', 'avispa', 'latita'][k], wheels: 'estandar', extra: 'banderin', paint: k * 2 });
    v.root.position.set(P.x, P.y, P.z); v.root.rotation.y = P.yaw; scene.add(v.root);
  }
}
if (mode === 'top') {
  const b = T.box; const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const span = Math.max(b.x1 - b.x0, b.z1 - b.z0);
  cam.position.set(cx, span * 1.05, cz + 1); cam.lookAt(cx, 0, cz);
} else if (mode === 'free') {
  cam.position.set(+q.get('x'), +q.get('y'), +q.get('z')); cam.lookAt(+q.get('lx'), +q.get('ly'), +q.get('lz'));
} else {
  const s = +(q.get('s') || 0) * T.len;
  const P = pointAt(T, s, +(q.get('d') || 0));
  const back = +(q.get('back') || 8), hh = +(q.get('h') || 3.4);
  cam.position.set(P.x - Math.sin(P.yaw) * back, P.y + hh, P.z - Math.cos(P.yaw) * back);
  cam.lookAt(P.x + Math.sin(P.yaw) * 12, P.y + 1, P.z + Math.cos(P.yaw) * 12);
}
const R = null;
W.update(R, +(q.get('t') || 3), 0.016, cam.position);
r.render(scene, cam);
window.__info = { buildMs: Math.round(buildMs), calls: r.info.render.calls, tris: r.info.render.triangles, tex: r.info.memory.textures, geo: r.info.memory.geometries };
document.title = 'ok';
</script></body></html>
