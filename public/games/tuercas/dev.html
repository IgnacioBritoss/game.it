<!doctype html>
<html><head><meta charset="utf-8"><title>dev</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#9fd6ff}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { THREE } from './models.js';
import { makeVehicle, DRIVER_IDS, BODY_IDS, WHEEL_IDS, EXTRA_IDS } from './vehicles.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fd6ff');
scene.add(new THREE.HemisphereLight('#ffffff', '#8a9a6a', 1.6));
const sun = new THREE.DirectionalLight('#fff4d6', 2.2); sun.position.set(-4, 8, 6); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: '#7cc46a' })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const mode = q.get('m') || 'all';
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
let tris = 0;
if (mode === 'all') {
  // todos los cuerpos con distintos pilotos, ruedas y accesorios
  BODY_IDS.forEach((body, i) => {
    const v = makeVehicle({ driver: DRIVER_IDS[i % 8], body, wheels: WHEEL_IDS[i % 5], extra: EXTRA_IDS[i % 5], paint: i });
    v.root.position.set((i % 4) * 3.2 - 4.8, 0, i < 4 ? 0 : -4.5); v.root.rotation.y = +(q.get('yaw') ?? 0.6);
    scene.add(v.root);
    v.root.traverse((o) => { if (o.isMesh && !o.userData.outline) tris += o.geometry.attributes.position.count / 3; });
  });
  cam.position.set(+(q.get('cx') ?? 0), +(q.get('cy') ?? 5), +(q.get('cz') ?? 13)); cam.lookAt(0, 0.6, -2);
} else if (mode === 'heads') {
  DRIVER_IDS.forEach((driver, i) => {
    const v = makeVehicle({ driver, body: q.get('body') || 'clasico', wheels: 'estandar', extra: 'banderin', paint: i });
    v.root.position.set((i % 4) * 2.6 - 3.9, 0, i < 4 ? 0 : -3.6); v.root.rotation.y = +(q.get('yaw') ?? 0.5);
    scene.add(v.root);
  });
  cam.position.set(+(q.get('cx') ?? 0), +(q.get('cy') ?? 3.2), +(q.get('cz') ?? 9)); cam.lookAt(0, 0.8, -1.6);
} else {
  const v = makeVehicle({ driver: q.get('driver') || 'capi', body: q.get('body') || 'clasico', wheels: q.get('wheels') || 'estandar', extra: q.get('extra') || 'banderin', paint: +(q.get('paint') || 0) });
  v.root.rotation.y = +(q.get('yaw') ?? 0.6); scene.add(v.root);
  cam.position.set(0, +(q.get('cy') ?? 1.6), +(q.get('cz') ?? 5)); cam.lookAt(0, 0.7, 0);
}
r.render(scene, cam);
window.__info = { tris, calls: r.info.render.calls, triangles: r.info.render.triangles };
document.title = 'ok';
</script></body></html>
